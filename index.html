
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | ISBAT University</title>
    <link rel="stylesheet" href="portal.css">

    <!-- Internal CSS for Quick Links -->
    <style>
        .quick-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .quick-card {
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-decoration: none;
            color: #1A1A2E;
            font-size: 18px;
            font-weight: bold;
        }

        .quick-card:hover {
            background: #EAF3DE;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <img src="images/isbat logo.jpg" alt="ISBAT Logo" class="logo">

        <h3>Student Portal</h3>
        <p>Lenard Lwanga</p>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="courses.html">My Courses</a>
            <a href="fees.html">Fee Statement</a>
        </nav>
    </aside>

    <main class="main-content">

        <div class="welcome">
            <div>
                <h1>Welcome, Lenard Lwanga Eston</h1>
                <p>Today's Date: 19 November 2026</p>
            </div>

            <span style="background-color:#EAF3DE; color:#27500A; padding:8px 18px; border-radius:20px;">
                Active
            </span>
        </div>

        <h2>Student Overview</h2>

        <section class="metrics">
            <div class="metric-card">
                <h3>GPA</h3>
                <p>3.8</p>
            </div>

            <div class="metric-card">
                <h3>Credit Hours</h3>
                <p>18</p>
            </div>

            <div class="metric-card">
                <h3>Outstanding Fee Balance</h3>
                <p>UGX 450,000</p>
            </div>
        </section>

        <h2>Quick Links</h2>

        <section class="quick-links">
            <a href="dashboard.html" class="quick-card">Dashboard</a>
            <a href="courses.html" class="quick-card">My Courses</a>
            <a href="fees.html" class="quick-card">Fee Statement</a>
            <a href="#" class="quick-card">Update Profile</a>
        </section>

    </main>

</body>
</html>
